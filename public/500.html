<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Ошибка 500 — Dream diary</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #1f1f1f;
        color: #e8dfdf;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 2rem));
        text-align: center;
      }

      .code {
        margin: 0;
        font-size: 5rem;
        font-weight: 700;
        line-height: 1;
      }

      h1 {
        margin: 1.5rem 0 0.75rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0;
        color: #737373;
        line-height: 1.5;
      }

      button {
        margin-top: 2rem;
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.375rem;
        background: #122558;
        color: #fff;
        cursor: pointer;
        font: inherit;
        border: 2px outset #222;
      }

      button:hover {
        border: 2px inset #222;
      }
    </style>
  </head>

  <body>
    <main>
      <p class="code">500</p>
      <h1>Что-то пошло не так</h1>
      <p>Попробуйте обновить страницу через несколько секунд.</p>
      <button type="button" onclick="window.location.reload()">
        Обновить страницу
      </button>
    </main>
  </body>
</html>
