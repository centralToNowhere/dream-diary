services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_HOST_PORT}:${POSTGRES_PORT:-5432}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user} -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    command: ['postgres', '-c', 'log_statement=all', '-c', 'log_duration=on']

  migrate:
    image: ghcr.io/amacneil/dbmate:latest
    command: --wait migrate
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./infrastructure/db/migrations:/db/migrations
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_API_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-dream-diary}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dream-diary-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dream-diary-local-secret}
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/"$${S3_BUCKET}" && mc anonymous set download local/"$${S3_BUCKET}" && mc admin user add local "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" && mc admin policy attach local readwrite --user "$${S3_ACCESS_KEY}"

volumes:
  postgres_data:
  minio_data:
    name: ${MINIO_VOLUME_NAME:-dream_diary_minio_data}
